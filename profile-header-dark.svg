      .wait-4{animation:profile-signal-poster-poster-dark-wait-4 16s linear infinite}
      .run-4{animation:profile-signal-poster-poster-dark-run-4 16s linear infinite}
      .pass-4{animation:profile-signal-poster-poster-dark-pass-4 16s linear infinite}
      .rail-4{animation:profile-signal-poster-poster-dark-rail-4 16s ease-in-out infinite}
    }
