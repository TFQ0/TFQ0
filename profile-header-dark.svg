      .trail{animation:profile-signal-poster-poster-dark-travel 16s linear infinite}
      .signal{animation:profile-signal-poster-poster-dark-breathe 4s ease-in-out infinite}
      .wait-1{animation:profile-signal-poster-poster-dark-wait-1 16s linear infinite}
      .run-1{animation:profile-signal-poster-poster-dark-run-1 16s linear infinite}
      .pass-1{animation:profile-signal-poster-poster-dark-pass-1 16s linear infinite}
      .rail-1{animation:profile-signal-poster-poster-dark-rail-1 16s ease-in-out infinite}
      .wait-2{animation:profile-signal-poster-poster-dark-wait-2 16s linear infinite}
      .run-2{animation:profile-signal-poster-poster-dark-run-2 16s linear infinite}
      .pass-2{animation:profile-signal-poster-poster-dark-pass-2 16s linear infinite}
      .rail-2{animation:profile-signal-poster-poster-dark-rail-2 16s ease-in-out infinite}
